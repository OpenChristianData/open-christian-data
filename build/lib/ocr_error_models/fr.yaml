# OCR error model — French historical printing
- error_id: fr.accent_aigu_dropped
  description: "Acute accent (é) misread as plain e"
  confusion: {source: "é", target: "e"}
- error_id: fr.accent_grave_dropped
  description: "Grave accent (è) misread as plain e"
  confusion: {source: "è", target: "e"}
- error_id: fr.cedilla_dropped
  description: "Cedilla (ç) misread as plain c"
  confusion: {source: "ç", target: "c"}
- error_id: fr.long_s_as_f
  description: "Long s (ſ) misread as f in older French printing"
  confusion: {source: "ſ", target: "f"}
- error_id: fr.rn_as_m
  description: "rn misread as m"
  confusion: {source: "rn", target: "m"}
