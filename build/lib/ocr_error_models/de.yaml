# OCR error model — German historical printing (Fraktur and Roman type)
- error_id: de.fraktur_s_as_f
  description: "Fraktur long s (ſ) misread as f"
  confusion: {source: "ſ", target: "f"}
- error_id: de.fraktur_u_as_n
  description: "Fraktur u misread as n due to similar strokes"
  confusion: {source: "u_fraktur", target: "n"}
- error_id: de.umlaut_ae
  description: "Umlaut ä misread as plain a or as ae"
  confusion: {source: "ä", target: "a"}
- error_id: de.umlaut_oe
  description: "Umlaut ö misread as plain o"
  confusion: {source: "ö", target: "o"}
- error_id: de.umlaut_ue
  description: "Umlaut ü misread as plain u"
  confusion: {source: "ü", target: "u"}
- error_id: de.eszett_as_ss
  description: "ß misread as ss or B"
  confusion: {source: "ß", target: "ss"}
- error_id: de.rn_as_m
  description: "rn misread as m"
  confusion: {source: "rn", target: "m"}
