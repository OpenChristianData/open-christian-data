# Preserve default secret detection; these exact retained JSON fields are checksums.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Verified SHA-256 fields in retained source and runtime records"
condition = "AND"
regexTarget = "match"
regexes = [
    '''^(?:_api\.py|_array_api_info\.py|_auth\.py|_commit_api\.py|_git_credential\.py|_jobs_api\.py|_space_api\.py|_tokenizer\.py|add_token_counts\.py|api\.py|auth\.py|client_middleware_digest_auth\.py|dbapi2\.py|dictionary_key_sha256|dictionary_keys_sha256|hf_api\.py|keys\.asc|oracle\-api\-repair\-binding\.json|provider\-api\-metadata\.json|sandbox\-access\-diagnostic\.json|secrets\.py|token\.py|tokenize\.py|tokens\.py|volume\-iii\-access\-leaf\-0007\.png|volume\-iii\-access\-leaf\-0009\.png|volume\-iii\-access\-leaf\-0441\.png)"\s*:\s*"[a-f0-9]{64}"$''',
]
paths = [
    '''^library/works/calvins\-institutes/publication/completion\.json$''',
    '''^library/works/calvins\-institutes/publication/final\-delivery\-audit\.json$''',
    '''^library/works/cox\-sacred\-hymns\-from\-the\-german\-1841/publication/completion\.json$''',
